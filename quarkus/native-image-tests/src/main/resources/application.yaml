quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:zenbpm-native;DB_CLOSE_DELAY=-1
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
vanillabp:
  prioritized-adapters:
    - zenbpm
  adapters:
    zenbpm:
      name-clash-avoidance: use-prefix
      rest-address: "${ZENBPM_REST_ADDRESS:http://localhost:8080}"
      grpc-address: "${ZENBPM_GRPC_ADDRESS:localhost:9090}"
