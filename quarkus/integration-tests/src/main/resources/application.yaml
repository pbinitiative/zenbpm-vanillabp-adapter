quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:zenbpm-e2e;DB_CLOSE_DELAY=-1
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
vanillabp:
  outbox:
    housekeeping:
      zone: UTC
  prioritized-adapters:
    - zenbpm
  adapters:
    zenbpm:
      name-clash-avoidance: use-prefix
      async-task-lock-renewal: PT2S
      user-task-poll-interval: PT1S
  workflow-modules:
    zenbpm-e2e:
      workflows:
        Packing:
          declared-aggregate-values:
            - items
        TaskFailures:
          adapters:
            zenbpm:
              retry-backoff: PT1S
