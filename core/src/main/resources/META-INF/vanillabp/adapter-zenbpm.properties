# Filled by the Maven build (resource filtering). The first three keys are read by the platform's
# VanillaBpParts to tell whether this adapter and the platform integration it runs on belong
# together.
part.version=${project.version}
part.artifact=${project.groupId}:${project.artifactId}
platform.version=${adapter-platform.version}
# The engine commit this build was tested against, and the protobuf version the job stream's
# stubs were generated with, which ProtobufRuntimeCheck reads.
zenbpm.engine=${zenbpm.commit}
protobuf.gencode=${protobuf.version}
