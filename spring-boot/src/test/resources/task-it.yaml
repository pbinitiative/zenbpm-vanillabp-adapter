spring:
  jpa:
    hibernate:
      ddl-auto: create
vanillabp:
  prioritized-adapters:
    - zenbpm
  adapters:
    zenbpm:
      name-clash-avoidance: use-prefix
      resources-location: classpath*:task-it
      async-task-lock-renewal: PT2S
  outbox:
    housekeeping:
      zone: UTC
  workflow-modules:
    deploy-it:
      adapters:
        zenbpm:
          job-timeout: PT3M
      workflows:
        TaskFailures:
          adapters:
            zenbpm:
              retry-backoff: PT1S
          tasks:
            reserve:
              adapters:
                zenbpm:
                  retry-backoff: PT2S
                  job-timeout: PT30S
            hold:
              adapters:
                zenbpm:
                  retry-backoff: PT1M
        TaskMatrix:
          tasks:
            pack:
              adapters:
                zenbpm:
                  job-timeout: PT42S
