spring:
  jpa:
    hibernate:
      ddl-auto: create
vanillabp:
  prioritized-adapters:
    - zenbpm
  adapters:
    zenbpm:
      name-clash-avoidance: use-prefix
      resources-location: classpath*:lifecycle-it
  outbox:
    wait-for-visibility-at-most: PT15S
    housekeeping:
      zone: UTC
  workflow-modules:
    deploy-it:
      workflows:
        Delivering:
          tasks:
            vanillabp__started:
              adapters:
                zenbpm:
                  job-timeout: PT2S
        Returning:
          tasks:
            vanillabp__ended:
              adapters:
                zenbpm:
                  retry-backoff: PT1S
        Picking:
          declared-aggregate-values:
            - parcels
        Settling:
          tasks:
            vanillabp__ended:
              adapters:
                zenbpm:
                  job-timeout: PT2S
