spring:
  jpa:
    hibernate:
      ddl-auto: update
vanillabp:
  prioritized-adapters:
    - zenbpm
  adapters:
    zenbpm:
      name-clash-avoidance: use-prefix
      resources-location: classpath*:metrics-it
      worker-threads: 1
      retry-backoff: PT1S
      async-task-lock-renewal: PT1H
  outbox:
    housekeeping:
      zone: UTC
  workflow-modules:
    deploy-it:
      workflows:
        Crating:
          tasks:
            weigh:
              adapters:
                zenbpm:
                  job-timeout: PT2S
