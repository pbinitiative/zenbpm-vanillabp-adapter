name: Checks
# The build of every pull request and of every push to main: Spotless, compile, javadoc,
# the tests, the per-platform coverage reports and the coverage gate, all of it one
# 'mvn install'. The job 'build' is the check branch protection on main requires.
"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One run per branch. On a pull request the newest run wins: nobody reads the answer of
  # a commit which has been pushed over. On main every commit keeps its own answer, so a
  # run there is never cancelled, and two merges within a minute both get a result.
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    # The classes are compiled for Java 21 ('version.java' in the root POM) on a newer JDK, as
    # in the VanillaBP repositories. That proves nothing about running on 21: a dependency
    # built for a newer Java still compiles against '--release 21' and only fails at run time.
    # So the same build runs on 21 as well. The run on the newer JDK keeps the check name
    # 'build', which the ruleset on main requires.
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: build
            java: 25.0.4+101.0.LTS
            reports: test-reports
          - check: build on Java 21
            java: "21"
            reports: test-reports-java-21
    runs-on: ubuntu-latest
    # well above a normal run, so a container which hangs in an integration test costs
    # this much runner time and not the six hours GitHub would otherwise allow
    timeout-minutes: 45
    permissions:
      contents: read
      # the engine image the integration tests start is pulled from ghcr.io, logged in
      # as this workflow, which keeps the pulls of a busy day under the anonymous limit
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          # no later step pushes or fetches, so the token does not stay in .git/config
          persist-credentials: false
      # The copies of the engine's api.yaml and zenbpm.proto have to be the engine's files of
      # the pinned commit, see decision 18 in the repository's DECISIONS.md. The script reads
      # them from GitHub, which the Maven build cannot do offline. It runs in the required
      # check only, because the copies do not depend on the JDK.
      - name: Check the engine copies against the pinned commit
        if: ${{ matrix.check == 'build' }}
        run: bin/check-engine-copies.sh
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      # logs out again at the end of the job, so the credentials do not stay on the runner
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The VanillaBP snapshots live in VanillaBP's GitHub Packages, see settings.xml. The
      # classic token reading them can read every package its owner can, so it is handed
      # to the one step which resolves dependencies and to no other. This step only says
      # whether it is there. A pull request from a fork gets no repository secrets, so
      # there it is missing, and the next step builds the snapshots from source instead.
      - name: Find out whether the package token is there
        id: packages
        env:
          TOKEN: "${{ secrets.VANILLABP_PACKAGES_TOKEN }}"
        run: echo "token=$([ -n "$TOKEN" ] && echo present || echo missing)" >> "$GITHUB_OUTPUT"
      # Without the token, the two VanillaBP repositories this one builds against are
      # public, so their snapshots are built from the head of their default branch into
      # the local repository, which is what a contributor does on their own machine. That
      # head can be newer than the published snapshot; a fork's pull request is then
      # checked against the newer one, and the run with the token after the merge against
      # the published one. The tests are skipped: they are those repositories' business.
      - name: Build the VanillaBP snapshots from source (no package token)
        if: ${{ steps.packages.outputs.token == 'missing' }}
        run: |
          git clone --quiet --depth 1 https://github.com/vanillabp/spi-for-java.git "$RUNNER_TEMP/spi-for-java"
          git clone --quiet --depth 1 https://github.com/vanillabp/adapter-platform-integration.git "$RUNNER_TEMP/adapter-platform-integration"
          mvn -f "$RUNNER_TEMP/spi-for-java/pom.xml" --batch-mode --no-transfer-progress install -DskipTests
          cd "$RUNNER_TEMP/adapter-platform-integration" && ./mvnw --batch-mode --no-transfer-progress install -DskipTests
      # 'install' and not 'install verify': install already runs every phase verify has,
      # and naming both walks the lifecycle twice. GitHub Packages is only asked where the
      # token is there; without it the snapshots built above are in the local repository.
      - name: Build and test
        env:
          VANILLABP_PACKAGES_USER: "${{ secrets.VANILLABP_PACKAGES_USER }}"
          VANILLABP_PACKAGES_TOKEN: "${{ secrets.VANILLABP_PACKAGES_TOKEN }}"
        run: |
          if [ -n "$VANILLABP_PACKAGES_TOKEN" ]; then
            packages=(-s "$GITHUB_WORKSPACE/.github/workflows/settings.xml" --update-snapshots)
          else
            packages=()
          fi
          mvn "${packages[@]}" --batch-mode --no-transfer-progress install
      # What a failing test printed is in its report, and Surefire's last line in the log
      # is never the interesting one. The coverage reports explain a red gate. A build
      # which fails before any test ran (Spotless, compilation) has nothing to upload,
      # and the run says so in a warning instead of hiding a wrong path for good.
      - name: Upload the reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.reports }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco*/**
            test-coverage-report/*/report/**
          retention-days: 7
          if-no-files-found: warn

  # The workflows are excluded from Spotless and nothing else reads them before they run.
  # A typo in an 'if:' shows only on the run which takes that branch, and the fork path
  # above never runs on a maintainer's pull request.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint the workflows
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
